name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Set package version
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'^(version\s*=\s*")([^"]*)(")', text, flags=re.M)
          if not match:
              raise SystemExit("Could not find version in pyproject.toml")

          current = match.group(2)
          version = "1.0.0"

          if ref_name.startswith("v") and ref_name[1:]:
              version = ref_name[1:]
          else:
              if current and all(part.isdigit() for part in current.split(".")) and len(current.split(".")) == 3:
                  parts = [int(part) for part in current.split(".")]
                  parts[2] += 1
                  version = ".".join(str(part) for part in parts)
              elif current:
                  version = current
              else:
                  version = "1.0.0"

          updated = text[:match.start()] + match.group(1) + version + match.group(3) + text[match.end():]
          path.write_text(updated)

          init_path = Path("vflask/__init__.py")
          init_text = init_path.read_text()
          init_match = re.search(r'^(__version__\s*=\s*")([^"]*)(")', init_text, flags=re.M)
          if not init_match:
              raise SystemExit("Could not find __version__ in vflask/__init__.py")
          init_updated = init_text[:init_match.start()] + init_match.group(1) + version + init_match.group(3) + init_text[init_match.end():]
          init_path.write_text(init_updated)
          print(f"Set package version to {version}")
          PY

      - name: Build package
        run: |
          rm -rf dist
          python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist/*
