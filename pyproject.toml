[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vflask"
version = "1.0.0"
description = "Modern typed Flask project scaffolder with blueprints, RBAC, and local module generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "jinja2>=3.1.4",
  "watchdog>=4.0.1",
  "rich>=13.0.0",
]

[project.scripts]
vflask = "vflask.cli.main:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vflask*"]

[tool.setuptools.package-data]
vflask = ["templates/**/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
