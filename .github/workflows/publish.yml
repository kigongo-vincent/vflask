name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Set package version
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          python - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("pyproject.toml")
          text = path.read_text()
          updated = re.sub(r'^(version\s*=\s*")[^"]*(")', rf'\g<1>{version}\2', text, count=1, flags=re.M)
          if updated == text:
              raise SystemExit("Could not update project version in pyproject.toml")
          path.write_text(updated)
          print(f"Set package version to {version}")
          PY

      - name: Build package
        run: |
          rm -rf dist
          python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist/*
