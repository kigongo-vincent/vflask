name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Set package version
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          export VERSION
          python - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("pyproject.toml")
          text = path.read_text()
          match = re.search(r'^(version\s*=\s*")([^"]*)(")', text, flags=re.M)
          if not match:
              raise SystemExit("Could not find version in pyproject.toml")

          current = match.group(2)
          if current != version:
              updated = text[:match.start()] + match.group(1) + version + match.group(3) + text[match.end():]
              path.write_text(updated)
              print(f"Set package version to {version}")
          else:
              print(f"Package version already set to {version}; continuing with build and PyPI upload check.")
          PY

      - name: Build package
        run: |
          rm -rf dist
          python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --skip-existing dist/*
